<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العالمية للدكور</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #f0d080;
      --gold-dark: #8a6a1f;
      --dark: #0d0b08;
      --dark2: #181510;
      --dark3: #221e14;
      --card-bg: rgba(30, 25, 12, 0.85);
      --text: #f5e8c8;
      --text-muted: #a89060;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.13) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(201,168,76,0.07) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative diamond grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(45deg, rgba(201,168,76,0.04) 0, rgba(201,168,76,0.04) 1px, transparent 0, transparent 50%),
        repeating-linear-gradient(-45deg, rgba(201,168,76,0.04) 0, rgba(201,168,76,0.04) 1px, transparent 0, transparent 50%);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 40px 20px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Header ornament */
    .ornament {
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin-bottom: 28px;
      position: relative;
    }
    .ornament::before, .ornament::after {
      content: '◆';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: 10px;
    }
    .ornament::before { left: -14px; }
    .ornament::after { right: -14px; }

    /* Avatar / Logo */
    .avatar-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-light));
      padding: 3px;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(201,168,76,0.3), 0 0 80px rgba(201,168,76,0.1);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--dark2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(201,168,76,0.25), 0 0 60px rgba(201,168,76,0.08); }
      50% { box-shadow: 0 0 50px rgba(201,168,76,0.45), 0 0 100px rgba(201,168,76,0.18); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 300;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-align: center;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), transparent);
      margin: 18px 0 32px;
    }

    /* Cards */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid rgba(201,168,76,0.18);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: slide-in 0.5s forwards;
    }

    .link-card:nth-child(1) { animation-delay: 0.1s; }
    .link-card:nth-child(2) { animation-delay: 0.2s; }
    .link-card:nth-child(3) { animation-delay: 0.3s; }
    .link-card:nth-child(4) { animation-delay: 0.4s; }
    .link-card:nth-child(5) { animation-delay: 0.5s; }

    @keyframes slide-in {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Shimmer effect */
    .link-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.08), transparent);
      transition: left 0.5s ease;
    }
    .link-card:hover::before { left: 100%; }

    .link-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(201,168,76,0.06), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .link-card:hover::after { opacity: 1; }

    .link-card:hover {
      border-color: rgba(201,168,76,0.55);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 32px rgba(201,168,76,0.15), 0 2px 8px rgba(0,0,0,0.4);
    }

    .icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s;
    }
    .link-card:hover .icon-wrap { transform: scale(1.1) rotate(-3deg); }

    .icon-wrap svg { width: 24px; height: 24px; }

    .link-info { flex: 1; text-align: right; }
    .link-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--text);
    }
    .link-handle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
      direction: ltr;
      text-align: right;
    }

    .arrow {
      color: var(--gold);
      font-size: 18px;
      opacity: 0.5;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .link-card:hover .arrow { opacity: 1; transform: translateX(-4px); }

    /* Platform colors */
    .whatsapp .icon-wrap { background: rgba(37,211,102,0.15); }
    .facebook .icon-wrap { background: rgba(24,119,242,0.15); }
    .instagram .icon-wrap { background: rgba(228,64,95,0.15); }
    .tiktok .icon-wrap { background: rgba(255,0,80,0.12); }
    .telegram .icon-wrap { background: rgba(0,136,204,0.15); }

    /* Footer */
    .footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      opacity: 0.5;
      letter-spacing: 1px;
    }
    .footer-ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .footer-line { width: 40px; height: 1px; background: var(--text-muted); opacity: 0.3; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark3);
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold-light);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>

<script>
  // Copy phone on whatsapp click (fallback)
  const toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Ripple effect on click
  document.querySelectorAll('.link-card').forEach(card => {
    card.addEventListener('click', function(e) {
      const ripple = document.createElement('span');
      ripple.style.cssText = `
        position:absolute;
        border-radius:50%;
        background:rgba(201,168,76,0.25);
        pointer-events:none;
        width:10px;height:10px;
        left:${e.offsetX - 5}px;
        top:${e.offsetY - 5}px;
        animation:ripple 0.6s ease-out forwards;
      `;
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    });
  });

  const style = document.createElement('style');
  style.textContent = `@keyframes ripple { to { transform:scale(30); opacity:0; } }`;
  document.head.appendChild(style);
</script>
